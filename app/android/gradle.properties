org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# 降低并发：本机内存压力大时，多个 worker/daemon 会把构建进程挤死（日志戛然而止、无报错）
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 禁用 Kotlin 增量编译：本环境文件锁限制会导致增量缓存目录删除失败
kotlin.incremental=false
# 禁用 Gradle daemon：本环境有并行 build 抢 .gradle 锁，daemon 常驻会加剧 lock 冲突
org.gradle.daemon=false
# 禁用 Kotlin 编译守护进程：沙箱杀 daemon 进程会报 "Daemon compilation failed: null"
kotlin.compiler.execution.strategy=in-process
# 禁用构建缓存与配置缓存：沙箱文件锁导致增量编译"找不到中间产物"(kernel_blob.bin/manifest 等)
org.gradle.caching=false
org.gradle.configuration-cache=false
# tflite_flutter 插件的 Java(1.8)/Kotlin(17) JVM 目标版本不一致，默认会直接报错
# "Inconsistent JVM Target Compatibility"；降级为警告即可（运行无影响）
kotlin.jvm.target.validation.mode=warning
